name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
        tags: ['v*']
    pull_request:
        branches: [main, develop]

# Least privilege by default: nothing in a test/build/PR run needs a write scope, so PRs
# from forks and Dependabot get a read-only token. Only the release job opts back into
# `contents: write`, which is the single scope `action-gh-release` needs to publish.
permissions:
    contents: read

# One run per ref: a fresh push to the same branch (or tag) cancels the superseded run
# instead of queueing behind it.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run type check
              run: npm run type-check

            - name: Run tests with coverage
              run: npm run test:coverage

            - name: Dry-run the version bump
              # version-bump.mjs derives manifest.json + versions.json from package.json,
              # so on a tree whose versions already agree it must be a byte-for-byte
              # no-op. Any diff here means `npm version` would publish a manifest nobody
              # intended (or that manifest/package drifted by hand).
              run: |
                  node version-bump.mjs
                  git diff --exit-code -- manifest.json versions.json

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  if-no-files-found: error
                  retention-days: 7

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  files: ./coverage/lcov.info
                  flags: unittests
                  name: codecov-umbrella
                  # Deliberately false: the repo has no Codecov token configured, so
                  # tokenless uploads are rate-limited and fail transiently. A flaky 4xx
                  # from the uploader must not block a build whose tests already passed.
                  fail_ci_if_error: false

    build:
        name: Build Plugin
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: plugin-build
                  path: |
                      main.js
                      manifest.json
                      styles.css
                  if-no-files-found: error
                  retention-days: 7

    release:
        name: Create Release
        runs-on: ubuntu-latest
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        # The only job that writes: `action-gh-release` creates the release and its assets.
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Verify tag, manifest and package versions agree
              # Fail before building anything, not after publishing a mismatched release.
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG="$(node -p "require('./package.json').version")"
                  MANIFEST="$(node -p "require('./manifest.json').version")"
                  if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MANIFEST" ]; then
                      echo "::error::Version mismatch — tag v${TAG}, package.json ${PKG}, manifest.json ${MANIFEST}"
                      exit 1
                  fi
                  echo "Release ${TAG}: tag, package.json and manifest.json agree."

            - name: Build plugin
              run: npm run build

            - name: Publish release assets
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      main.js
                      manifest.json
                      styles.css
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    package-extension:
        name: Package Chrome Extension
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Package extension
              run: npm run package:extension

            - name: Verify ZIP is non-empty and has manifest.json at its root
              # The Web Store rejects a ZIP that does not carry manifest.json at its root.
              run: |
                  ZIP="$(ls dist/youtube-to-note-ext-*.zip)"
                  if [ ! -s "$ZIP" ]; then
                      echo "::error::${ZIP} is empty or missing"
                      exit 1
                  fi
                  if ! unzip -Z1 "$ZIP" | grep -qx 'manifest.json'; then
                      echo "::error::manifest.json is not at the root of ${ZIP}:"
                      unzip -Z1 "$ZIP"
                      exit 1
                  fi
                  echo "OK: ${ZIP} ($(du -h "$ZIP" | cut -f1)), manifest.json at zip root."

            - name: Upload extension artifact
              uses: actions/upload-artifact@v4
              with:
                  name: extension-zip
                  path: dist/*.zip
                  if-no-files-found: error
                  retention-days: 7
